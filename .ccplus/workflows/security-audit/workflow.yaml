name: security-audit
description: Security audit followed by remediation, testing, and sign-off.
default_phase: audit
phases:
  - name: audit
    context: |
      Audit the codebase for security vulnerabilities (OWASP Top 10, injection, XSS, CSRF, secrets).
      READ ONLY — do not write or modify any files. Document all findings with severity ratings.
      Check: hardcoded secrets, SQL injection, XSS, authentication bypass, insecure crypto, SSRF.
    agent_hints:
      - security-reviewer
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Audit phase: document vulnerabilities with severity ratings. Do not modify code.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Audit phase: document vulnerabilities with severity ratings. Do not modify code.'
      - tool_name: Bash
        action: block
        conditions: []
        message: 'Audit phase: use Read, Grep, and Glob for investigation.'
  - name: execute
    context: |
      Remediate the security findings identified in the audit phase.
      Address CRITICAL issues first, then HIGH, then MEDIUM. Document each fix.
    agent_hints:
      - code_agent
      - frontend-agent
      - build-error-resolver
    tool_rules:
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Execute phase: complete remediation. Transition to test phase first."
  - name: test
    context: |
      Write security tests to verify the remediations work.
      Test that the vulnerabilities are actually fixed, not just patched superficially.
    agent_hints:
      - tdd-guide
      - e2e-runner
    tool_rules:
      - tool_name: Edit
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Test phase: focus on writing tests, not implementation changes."
      - tool_name: Write
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Test phase: focus on writing tests, not implementation changes."
  - name: signoff
    context: |
      Final security sign-off. Verify all critical and high findings are resolved.
      Confirm no new vulnerabilities were introduced during remediation.
    agent_hints:
      - security-reviewer
      - merge-cleanup
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Signoff phase: use Bash for git operations only. No code changes.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Signoff phase: use Bash for git operations only. No code changes.'
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Signoff phase: commits are blocked until sign-off completes."
transitions:
  - from: audit
    to: execute
  - from: execute
    to: test
  - from: test
    to: signoff
  - from: test
    to: execute
  - from: signoff
    to: complete
