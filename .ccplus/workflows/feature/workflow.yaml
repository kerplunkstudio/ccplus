name: feature
description: >-
  Full feature development lifecycle with design, planning, implementation,
  testing, and review.
default_phase: design
transitions:
  - from: design
    to: plan
  - from: plan
    to: execute
  - from: execute
    to: test
  - from: test
    to: review
  - from: review
    to: merge
  - from: review
    to: execute
  - from: test
    to: execute
  - from: merge
    to: execute
  - from: merge
    to: complete
phases:
  - name: design
    context: >
      Understand requirements. Explore the codebase. Identify affected systems,
      risks, and dependencies.

      Produce a clear implementation plan before any code is written.
    agent_hints:
      - architect
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Design phase: use Read, Grep, and Glob to explore. Do NOT write code — delegate to code_agent via the Agent tool instead.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Design phase: use Read, Grep, and Glob to explore. Do NOT write code — delegate to code_agent via the Agent tool instead.'
      - tool_name: Bash
        action: block
        conditions: []
        message: 'Design phase: use Read, Grep, and Glob to explore the codebase. Do NOT run commands — delegate implementation to code_agent via the Agent tool.'
  - name: plan
    context: >
      Write a detailed step-by-step implementation plan. Include file paths,
      function signatures,

      and test strategy. Get user confirmation before proceeding.
    agent_hints:
      - planner
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Plan phase: use Read, Grep, and Glob to research. Output your plan as text. Do NOT write code — spawn code_agent in the execute phase.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Plan phase: use Read, Grep, and Glob to research. Output your plan as text. Do NOT write code — spawn code_agent in the execute phase.'
      - tool_name: Bash
        action: block
        conditions: []
        message: 'Plan phase: use Read, Grep, and Glob to research the codebase. Do NOT run commands — delegate implementation to code_agent.'
  - name: execute
    context: >
      Implement the feature following the approved plan. Write clean, tested,
      production-ready code.

      Follow TypeScript strict mode, immutable patterns, and project
      conventions.
    agent_hints:
      - code_agent
      - frontend-agent
      - build-error-resolver
    tool_rules:
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Execute phase: complete code review before committing. Transition to review phase first."
  - name: test
    context: >
      Write and run tests. Verify 80%+ coverage. Run E2E tests for critical user
      flows.

      All tests must pass before proceeding.
    agent_hints:
      - tdd-guide
      - e2e-runner
    tool_rules:
      - tool_name: Edit
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Test phase: focus on writing tests, not implementation changes."
      - tool_name: Write
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Test phase: focus on writing tests, not implementation changes."
  - name: review
    context: >
      Review the complete implementation for correctness, security, performance,
      and maintainability.

      Check for edge cases, security vulnerabilities, and code quality issues.
    agent_hints:
      - code-reviewer
      - security-reviewer
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Review phase: report findings with file:line references.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Review phase: report findings with file:line references.'
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Review phase: commits are blocked until review completes."
  - name: merge
    context: |
      Commit any remaining worktree changes, cherry-pick commits to main, remove the worktree, and prune the branch.
      This is the final cleanup phase. The merge-cleanup agent handles all git operations.
    agent_hints:
      - merge-cleanup
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Merge phase: use Bash for git operations only.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Merge phase: use Bash for git operations only.'
