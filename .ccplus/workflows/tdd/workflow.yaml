name: tdd
description: Test-driven development — write tests first, then implement to make them pass.
default_phase: plan
phases:
  - name: plan
    context: |
      Define interfaces and contracts. Identify what needs to be built.
      Do NOT write implementation code yet — only interfaces and type signatures.
    agent_hints:
      - planner
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Plan phase: use Read, Grep, and Glob to research. Output your plan as text.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Plan phase: use Read, Grep, and Glob to research. Output your plan as text.'
      - tool_name: Bash
        action: block
        conditions: []
        message: 'Plan phase: use Read, Grep, and Glob to research the codebase.'
  - name: test
    context: |
      Write failing tests first (RED phase). Cover unit, integration, and E2E as appropriate.
      Tests must fail before implementation starts. Verify they fail for the right reason.
    agent_hints:
      - tdd-guide
    tool_rules:
      - tool_name: Edit
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Test phase: focus on writing tests, not implementation changes."
      - tool_name: Write
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Test phase: focus on writing tests, not implementation changes."
  - name: execute
    context: |
      Write the minimal implementation to make the tests pass (GREEN phase).
      Do not add features beyond what the tests require. Keep code simple.
    agent_hints:
      - code_agent
      - frontend-agent
    tool_rules:
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Execute phase: complete code review before committing. Transition to review phase first."
  - name: verify
    context: |
      Run the full test suite. Verify 80%+ coverage. Run E2E tests for user flows.
      If coverage is insufficient, return to the test phase to add more tests.
    agent_hints:
      - tdd-guide
      - e2e-runner
    tool_rules:
      - tool_name: Edit
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Verify phase: focus on running and verifying tests, not implementation changes."
      - tool_name: Write
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Verify phase: focus on running and verifying tests, not implementation changes."
  - name: review
    context: |
      Review the implementation and tests. Ensure the code is clean, readable, and maintainable.
      Check that tests are meaningful and not just passing by coincidence.
    agent_hints:
      - code-reviewer
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Review phase: report findings with file:line references.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Review phase: report findings with file:line references.'
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Review phase: commits are blocked until review completes."
  - name: merge
    context: |
      Commit any remaining worktree changes, cherry-pick commits to main, remove the worktree, and prune the branch.
      This is the final cleanup phase. The merge-cleanup agent handles all git operations.
    agent_hints:
      - merge-cleanup
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Merge phase: use Bash for git operations only.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Merge phase: use Bash for git operations only.'
transitions:
  - from: plan
    to: test
  - from: test
    to: execute
  - from: execute
    to: verify
  - from: verify
    to: review
  - from: review
    to: merge
  - from: merge
    to: complete
  - from: verify
    to: test
  - from: review
    to: execute
