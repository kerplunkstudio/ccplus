name: default
description: Minimal workflow for quick tasks and one-off changes.
default_phase: execute
phases:
  - name: execute
    context: |
      Implement the requested change. Focus on correctness, minimal diff, and clean code.
      Follow project conventions (TypeScript strict mode, immutable patterns, no console.log).
    agent_hints:
      - code_agent
      - frontend-agent
      - build-error-resolver
    tool_rules:
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Execute phase: complete code review before committing. Transition to review phase first."
  - name: review
    context: |
      Review the implementation for correctness, security, and code quality.
      Check for edge cases, missing error handling, and adherence to project conventions.
    agent_hints:
      - code-reviewer
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Review phase: report findings with file:line references.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Review phase: report findings with file:line references.'
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Review phase: commits are blocked until review completes."
  - name: merge
    context: |
      Commit any remaining worktree changes, cherry-pick commits to main, remove the worktree, and prune the branch.
      This is the final cleanup phase. The merge-cleanup agent handles all git operations.
    agent_hints:
      - merge-cleanup
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Merge phase: use Bash for git operations only.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Merge phase: use Bash for git operations only.'
transitions:
  - from: execute
    to: review
  - from: review
    to: merge
  - from: merge
    to: complete
  - from: review
    to: execute
