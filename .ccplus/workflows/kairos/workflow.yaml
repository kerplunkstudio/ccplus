name: kairos
description: KAIROS retrospective analysis workflow. Analyzes sessions, reviews prompt changes, and merges improvements.
default_phase: analyze
worktree: true
phases:
  - name: analyze
    context: |
      KAIROS agent analyzes batch of sessions and applies prompt improvements.
      Read session data, correlate bug-fix chains, identify prompt deficiencies.
      Directly edit prompt/agent/workflow files, then output JSON summary.
    agent_hints:
      - kairos
    tool_rules:
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git push"]
        message: "KAIROS may not push to remote."

  - name: review
    context: |
      Code reviewer validates proposed prompt changes.
      Verify changes are evidence-based, targeted, and won't introduce new issues.
      Check that confidence scores are justified and evidence is solid.
    agent_hints:
      - code-reviewer
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: "Review phase: report findings with file:line references."
      - tool_name: Write
        action: block
        conditions: []
        message: "Review phase: report findings with file:line references."
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Review phase: commits are blocked until review completes."

  - name: merge
    context: |
      Commit any remaining worktree changes, cherry-pick commits to main, remove the worktree, and prune the branch.
      This is the final cleanup phase. The merge-cleanup agent handles all git operations.
    agent_hints:
      - merge-cleanup
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Merge phase: use Bash for git operations only.'

transitions:
  - from: analyze
    to: review
  - from: review
    to: merge
  - from: review
    to: analyze
  - from: merge
    to: complete
