name: bug-fix
description: Systematic bug investigation and fix with regression testing.
default_phase: execute
phases:
  - name: execute
    context: |
      Investigate the bug. Find the root cause (file:line). Implement the minimal fix.
      Document the root cause before writing any code. Do NOT guess or patch symptoms.
    agent_hints:
      - debugger
      - build-error-resolver
      - code_agent
    tool_rules:
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Execute phase: complete code review before committing. Transition to review phase first."
  - name: test
    context: |
      Write a regression test that fails before the fix and passes after.
      Verify no other tests broke. Run the full test suite.
    agent_hints:
      - tdd-guide
    tool_rules:
      - tool_name: Edit
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Test phase: focus on writing tests, not implementation changes."
      - tool_name: Write
        action: warn
        conditions: ["file_path_not_contains:test,spec,__tests__"]
        message: "Test phase: focus on writing tests, not implementation changes."
  - name: review
    context: |
      Review the fix and regression test. Verify the root cause is properly addressed (not a workaround).
      Check that the fix does not introduce new issues.
    agent_hints:
      - code-reviewer
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Review phase: report findings with file:line references.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Review phase: report findings with file:line references.'
      - tool_name: Bash
        action: block
        conditions: ["command_contains:git commit"]
        message: "Review phase: commits are blocked until review completes."
  - name: merge
    context: |
      Commit any remaining worktree changes, cherry-pick commits to main, remove the worktree, and prune the branch.
      This is the final cleanup phase. The merge-cleanup agent handles all git operations.
    agent_hints:
      - merge-cleanup
    tool_rules:
      - tool_name: Edit
        action: block
        conditions: []
        message: 'Merge phase: use Bash for git operations only.'
      - tool_name: Write
        action: block
        conditions: []
        message: 'Merge phase: use Bash for git operations only.'
transitions:
  - from: execute
    to: test
  - from: test
    to: review
  - from: review
    to: merge
  - from: merge
    to: execute
  - from: merge
    to: complete
  - from: test
    to: execute
  - from: review
    to: execute
